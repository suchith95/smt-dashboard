<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="SMT Mastery Dashboard: research prototype preview with fictional students.">
<title>SMT Mastery Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&family=Public+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Layout idea: a quiet working surface — sticky header with tabs, one main column,
   and in Research view a right-hand "study margin" in serif, like annotations on a field log. */
:root {
  --bg: #f2f5f5;
  --surface: #ffffff;
  --surface-2: #e9eff0;
  --ink: #13201f;
  --ink-2: #4b5c5a;
  --ink-3: #74837f;
  --line: #d3dcdc;
  --accent: #0d6772;
  --accent-ink: #ffffff;
  --accent-soft: #dbeef0;
  --note: #7a4a12;
  --note-soft: #fbf2e4;
  --note-line: #ead6b6;
  --l1: #b8402c; --l1-soft: #fbe5df;
  --l2: #a86d12; --l2-soft: #faefd6;
  --l3: #2b7a46; --l3-soft: #dff0e4;
  --l4: #3a4db3; --l4-soft: #e3e6f9;
  --l0: #8b9896; --l0-soft: #eef1f1;
  --danger: #b3261e;
  --shadow: 0 1px 2px rgba(16, 32, 31, .06), 0 6px 24px rgba(16, 32, 31, .06);
  --font-body: "Public Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --font-note: "Newsreader", Georgia, "Times New Roman", serif;
  --radius: 10px;
  --pad-row: 10px;
  --pad-card: 18px;
  --fs: 15px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1515; --surface: #151f1f; --surface-2: #1c2928; --ink: #e2ecea; --ink-2: #a3b4b1; --ink-3: #7d8f8c;
    --line: #2a3a39; --accent: #52b9c4; --accent-ink: #062022; --accent-soft: #123437;
    --note: #e3b578; --note-soft: #231c12; --note-line: #4a3a22;
    --l1: #f08470; --l1-soft: #3a1e19; --l2: #e4b252; --l2-soft: #352912; --l3: #64c58a; --l3-soft: #14301f;
    --l4: #97a4f3; --l4-soft: #1f2548; --l0: #7d8f8c; --l0-soft: #1f2a29; --danger: #ff8a80;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 28px rgba(0,0,0,.35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1515; --surface: #151f1f; --surface-2: #1c2928; --ink: #e2ecea; --ink-2: #a3b4b1; --ink-3: #7d8f8c;
  --line: #2a3a39; --accent: #52b9c4; --accent-ink: #062022; --accent-soft: #123437;
  --note: #e3b578; --note-soft: #231c12; --note-line: #4a3a22;
  --l1: #f08470; --l1-soft: #3a1e19; --l2: #e4b252; --l2-soft: #352912; --l3: #64c58a; --l3-soft: #14301f;
  --l4: #97a4f3; --l4-soft: #1f2548; --l0: #7d8f8c; --l0-soft: #1f2a29; --danger: #ff8a80;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 28px rgba(0,0,0,.35);
  color-scheme: dark;
}
/* Color-vision-safe level palette (Okabe–Ito derived) */
:root[data-cvd="on"] { --l1: #c25400; --l2: #b8860b; --l3: #00866a; --l4: #0068a8; }
:root[data-cvd="on"][data-theme="dark"] { --l1: #ff9a4d; --l2: #f0c24a; --l3: #3fd0a8; --l4: #5fb4ff; }
@media (prefers-color-scheme: dark) { :root[data-cvd="on"]:not([data-theme="light"]) { --l1: #ff9a4d; --l2: #f0c24a; --l3: #3fd0a8; --l4: #5fb4ff; } }
:root[data-density="compact"] { --pad-row: 5px; --pad-card: 12px; }
:root[data-reduce-motion="on"] * { transition: none !important; animation: none !important; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

* { box-sizing: border-box; }
html, body { height: 100%; }
html { font-size: var(--fs); }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--font-body); line-height: 1.45; -webkit-font-smoothing: antialiased;
}
h1, h2, h3, h4 { margin: 0; text-wrap: balance; line-height: 1.2; }
h2 { font-size: 1.25rem; font-weight: 700; }
h3 { font-size: 1.02rem; font-weight: 700; }
h4 { font-size: .86rem; font-weight: 700; }
p { margin: 0; }
a { color: var(--accent); }
code, .mono { font-family: var(--font-mono); font-size: .82em; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--ink-2); }
.faint { color: var(--ink-3); }
.small { font-size: .82rem; }
.tiny { font-size: .74rem; }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.row.tight { gap: 6px; }
.spread { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.stack.lg { gap: 20px; }
.grid { display: grid; gap: 14px; }
.hidden { display: none !important; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

/* ---------- Header ---------- */
.app-header {
  position: sticky; top: 0; z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line);
}
.app-header .inner {
  max-width: 1440px; margin: 0 auto; padding: 10px 20px; display: flex; align-items: center; gap: 18px; flex-wrap: wrap;
}
.brand { display: flex; align-items: center; gap: 10px; }
.brand-mark {
  width: 34px; height: 34px; border-radius: 8px; background: var(--accent); color: var(--accent-ink);
  display: grid; place-items: center; font-weight: 800; font-size: .78rem; letter-spacing: .02em;
}
.brand-name { font-weight: 750; font-size: .98rem; }
.brand-sub { font-size: .72rem; color: var(--ink-3); }
.tabs { display: flex; gap: 2px; flex: 1; flex-wrap: wrap; }
.tab {
  border: 0; background: transparent; color: var(--ink-2); font: inherit; font-weight: 600; font-size: .9rem;
  padding: 8px 12px; border-radius: 8px; cursor: pointer;
}
.tab:hover { background: var(--surface-2); color: var(--ink); }
.tab[aria-selected="true"] { background: var(--accent-soft); color: var(--accent); }
.header-tools { display: flex; align-items: center; gap: 8px; }

.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 9px; padding: 2px; background: var(--surface-2); }
.seg button {
  border: 0; background: transparent; font: inherit; font-size: .8rem; font-weight: 650; color: var(--ink-2);
  padding: 5px 11px; border-radius: 7px; cursor: pointer;
}
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.seg.research button[aria-pressed="true"][data-mode="research"] { background: var(--note-soft); color: var(--note); }

/* ---------- Buttons & inputs ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--line);
  background: var(--surface); color: var(--ink); font: inherit; font-size: .84rem; font-weight: 600;
  padding: 7px 12px; border-radius: 8px; cursor: pointer; white-space: nowrap;
}
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost:hover { background: var(--surface-2); }
.btn.danger { color: var(--danger); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.sm { padding: 4px 9px; font-size: .78rem; }
.btn.icon { padding: 7px; }
.btn svg { width: 16px; height: 16px; }
select, input[type="text"], input[type="url"], input[type="date"], input[type="number"], input[type="search"], textarea {
  font: inherit; font-size: .88rem; color: var(--ink); background: var(--surface); border: 1px solid var(--line);
  border-radius: 8px; padding: 7px 10px; min-width: 0;
}
textarea { resize: vertical; width: 100%; }
label.field { display: flex; flex-direction: column; gap: 4px; font-size: .78rem; font-weight: 650; color: var(--ink-2); }
label.check { display: inline-flex; align-items: center; gap: 8px; font-size: .86rem; cursor: pointer; }
input[type="checkbox"], input[type="radio"] { accent-color: var(--accent); width: 16px; height: 16px; }

/* ---------- Main layout ---------- */
.shell { max-width: 1440px; margin: 0 auto; padding: 20px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 20px; }
body.research .shell { grid-template-columns: minmax(0, 1fr) 340px; }
@media (max-width: 1080px) { body.research .shell { grid-template-columns: minmax(0, 1fr); } }
main { min-width: 0; display: flex; flex-direction: column; gap: 18px; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: var(--pad-card); }
.card.flush { padding: 0; overflow: hidden; }
.card-head { padding: 14px var(--pad-card); border-bottom: 1px solid var(--line); }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 14px; flex-wrap: wrap; }
.page-head .kicker { font-size: .76rem; font-weight: 700; color: var(--ink-3); text-transform: uppercase; letter-spacing: .06em; }
.toolbar { display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap; }

.stat { display: flex; flex-direction: column; gap: 2px; }
.stat .v { font-size: 1.5rem; font-weight: 750; font-variant-numeric: tabular-nums; line-height: 1.1; }
.stat .k { font-size: .76rem; color: var(--ink-2); font-weight: 600; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.stats .card { padding: 14px 16px; }

/* ---------- Mastery chips ---------- */
.lv { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; font-size: .8rem; padding: 3px 9px; border-radius: 999px;
  border: 1px solid transparent; font-variant-numeric: tabular-nums; white-space: nowrap; }
.lv .n { display: inline-grid; place-items: center; min-width: 18px; height: 18px; border-radius: 5px; color: #fff; font-size: .72rem; padding: 0 3px; }
.lv-1 { background: var(--l1-soft); color: var(--l1); } .lv-1 .n { background: var(--l1); }
.lv-2 { background: var(--l2-soft); color: var(--l2); } .lv-2 .n { background: var(--l2); }
.lv-3 { background: var(--l3-soft); color: var(--l3); } .lv-3 .n { background: var(--l3); }
.lv-4 { background: var(--l4-soft); color: var(--l4); } .lv-4 .n { background: var(--l4); }
.lv-0 { background: var(--l0-soft); color: var(--ink-3); } .lv-0 .n { background: var(--l0); }
:root[data-theme="dark"] .lv .n { color: #0b1212; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .lv .n { color: #0b1212; } }
.pill { display: inline-flex; align-items: center; gap: 5px; font-size: .72rem; font-weight: 700; padding: 2px 8px; border-radius: 999px;
  background: var(--surface-2); color: var(--ink-2); border: 1px solid var(--line); white-space: nowrap; }
.pill.flag { background: var(--l2-soft); color: var(--l2); border-color: transparent; }
.pill.accent { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.pill.note { background: var(--note-soft); color: var(--note); border-color: var(--note-line); }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }

/* ---------- Distribution bars ---------- */
.dist { display: flex; height: 10px; border-radius: 5px; overflow: hidden; background: var(--l0-soft); min-width: 80px; }
.dist span { display: block; height: 100%; }
.dist .d1 { background: var(--l1); } .dist .d2 { background: var(--l2); } .dist .d3 { background: var(--l3); } .dist .d4 { background: var(--l4); }
.legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: .76rem; color: var(--ink-2); }
.legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; margin-right: 5px; vertical-align: -1px; }

/* ---------- Section cards (Today) ---------- */
.sections { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px; }
.sec-card { display: flex; flex-direction: column; gap: 12px; }
.sec-card .when { font-size: .78rem; font-weight: 700; color: var(--accent); }
.sec-card .facts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.sec-card .facts div { background: var(--surface-2); border-radius: 8px; padding: 8px 10px; }
.sec-card .facts b { display: block; font-size: 1.1rem; font-variant-numeric: tabular-nums; }
.sec-card .facts span { font-size: .72rem; color: var(--ink-2); font-weight: 600; }

/* ---------- Tables ---------- */
.table-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: .88rem; }
th { text-align: left; font-size: .72rem; text-transform: uppercase; letter-spacing: .05em; color: var(--ink-3); font-weight: 700;
  padding: 9px 12px; border-bottom: 1px solid var(--line); background: var(--surface); position: sticky; top: 0; z-index: 1; white-space: nowrap; }
td { padding: var(--pad-row) 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tbody tr:last-child td { border-bottom: 0; }
tbody tr:hover td { background: color-mix(in srgb, var(--surface-2) 55%, transparent); }
tr.focusrow td { background: var(--accent-soft) !important; }
tr[tabindex]:focus { outline: none; }
tr[tabindex]:focus-visible td:first-child { box-shadow: inset 3px 0 0 var(--accent); }
td.name { font-weight: 650; white-space: nowrap; }
.linklike { background: none; border: 0; padding: 0; font: inherit; color: inherit; cursor: pointer; text-align: left; }
.linklike:hover { color: var(--accent); text-decoration: underline; }

/* Score buttons */
.scorebtns { display: inline-flex; gap: 4px; }
.sb { width: 34px; height: 30px; border-radius: 7px; border: 1px solid var(--line); background: var(--surface); color: var(--ink-2);
  font: inherit; font-weight: 750; font-size: .86rem; cursor: pointer; font-variant-numeric: tabular-nums; }
.sb:hover { background: var(--surface-2); color: var(--ink); }
.sb[aria-pressed="true"][data-level="1"] { background: var(--l1); border-color: var(--l1); color: #fff; }
.sb[aria-pressed="true"][data-level="2"] { background: var(--l2); border-color: var(--l2); color: #fff; }
.sb[aria-pressed="true"][data-level="3"] { background: var(--l3); border-color: var(--l3); color: #fff; }
.sb[aria-pressed="true"][data-level="4"] { background: var(--l4); border-color: var(--l4); color: #fff; }
:root[data-theme="dark"] .sb[aria-pressed="true"] { color: #0b1212; }
.trace { font-family: var(--font-mono); font-size: .7rem; color: var(--note); margin-top: 4px; white-space: nowrap; }

/* Standard picker chips */
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: var(--surface); color: var(--ink-2); font: inherit; font-size: .8rem; font-weight: 650;
  padding: 6px 10px; border-radius: 8px; cursor: pointer; text-align: left; }
.chip small { display: block; font-weight: 500; color: var(--ink-3); font-size: .72rem; }
.chip[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
.chip[aria-pressed="true"] small { color: var(--accent); }

/* Rubric strip */
.rubric { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
@media (max-width: 800px) { .rubric { grid-template-columns: 1fr 1fr; } }
.rubric > div { border-radius: 8px; padding: 9px 11px; font-size: .8rem; border-top: 3px solid; background: var(--surface-2); }
.rubric .r1 { border-color: var(--l1); } .rubric .r2 { border-color: var(--l2); } .rubric .r3 { border-color: var(--l3); } .rubric .r4 { border-color: var(--l4); }
.rubric b { display: block; font-size: .76rem; margin-bottom: 3px; }
details.disclose > summary { cursor: pointer; list-style: none; font-weight: 650; font-size: .86rem; display: flex; align-items: center; gap: 8px; }
details.disclose > summary::-webkit-details-marker { display: none; }
details.disclose > summary::before { content: "▸"; color: var(--ink-3); transition: transform .15s; display: inline-block; }
details.disclose[open] > summary::before { transform: rotate(90deg); }

.progress { height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; min-width: 120px; }
.progress span { display: block; height: 100%; background: var(--accent); }
.kbd { font-family: var(--font-mono); font-size: .72rem; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; background: var(--surface); }

/* Heatmap */
.heat td, .heat th { padding: 4px 6px; text-align: center; }
.heat td.name, .heat th:first-child { text-align: left; }
.hc { width: 100%; min-width: 40px; height: 28px; border-radius: 6px; border: 0; font: inherit; font-weight: 750; font-size: .8rem; cursor: pointer; font-variant-numeric: tabular-nums; }
.hc.h1 { background: var(--l1-soft); color: var(--l1); } .hc.h2 { background: var(--l2-soft); color: var(--l2); }
.hc.h3 { background: var(--l3-soft); color: var(--l3); } .hc.h4 { background: var(--l4-soft); color: var(--l4); }
.hc.h0 { background: transparent; color: var(--ink-3); border: 1px dashed var(--line); }
.hc .sub { display: block; font-size: .6rem; font-weight: 500; opacity: .8; line-height: 1; }

/* Group cards */
.groups { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px; }
.grp { border-radius: 8px; padding: 10px 12px; }
.grp.g1 { background: var(--l1-soft); } .grp.g2 { background: var(--l2-soft); } .grp.gi { background: var(--note-soft); border: 1px solid var(--note-line); }
.grp h4 { margin-bottom: 4px; }
.grp.g1 h4 { color: var(--l1); } .grp.g2 h4 { color: var(--l2); } .grp.gi h4 { color: var(--note); }
.names { display: flex; flex-wrap: wrap; gap: 4px; }
.names button { font: inherit; font-size: .78rem; border: 0; background: var(--surface); color: var(--ink); padding: 2px 8px; border-radius: 999px; cursor: pointer; }
.names button:hover { text-decoration: underline; }

/* Students view */
.student-layout { display: grid; grid-template-columns: 260px minmax(0, 1fr); gap: 18px; align-items: start; }
@media (max-width: 860px) { .student-layout { grid-template-columns: 1fr; } .student-list { max-height: 240px; } }
.student-list { max-height: calc(100vh - 220px); overflow-y: auto; padding: 6px; display: flex; flex-direction: column; gap: 2px; }
.student-list button { display: flex; justify-content: space-between; align-items: center; gap: 8px; border: 0; background: transparent; font: inherit;
  font-size: .86rem; padding: 7px 10px; border-radius: 7px; cursor: pointer; color: var(--ink); text-align: left; }
.student-list button:hover { background: var(--surface-2); }
.student-list button[aria-current="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 650; }
.multiples { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
.mini { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; background: var(--surface); cursor: pointer; text-align: left; font: inherit; color: inherit; }
.mini:hover { border-color: var(--accent); }
.mini svg { width: 100%; height: auto; display: block; margin-top: 6px; }
.layer { border-left: 3px solid var(--line); padding-left: 12px; }
.layer-tag { font-size: .68rem; font-weight: 800; text-transform: uppercase; letter-spacing: .07em; color: var(--ink-3); }
pre.code { background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 12px; font-family: var(--font-mono);
  font-size: .74rem; overflow: auto; max-height: 460px; margin: 0; color: var(--ink); }
textarea.code { font-family: var(--font-mono); font-size: .74rem; min-height: 180px; background: var(--surface-2); }

/* ---------- Drawer & dialogs ---------- */
.scrim { position: fixed; inset: 0; background: rgba(8, 16, 16, .42); z-index: 40; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(560px, 100%); background: var(--surface); z-index: 41; border-left: 1px solid var(--line);
  box-shadow: var(--shadow); display: flex; flex-direction: column; }
.drawer-head { padding: 16px 20px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
.drawer-body { padding: 18px 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 18px; flex: 1; }
.timeline { display: flex; flex-direction: column; gap: 8px; }
.entry { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; display: flex; flex-direction: column; gap: 5px; }
.entry.current { border-color: var(--accent); }
.entry.void, .entry.superseded { opacity: .6; }
.entry.void .lv, .entry.superseded .lv { text-decoration: line-through; }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.form-grid .full { grid-column: 1 / -1; }
.dialog { position: fixed; z-index: 45; top: 50%; left: 50%; transform: translate(-50%, -50%); width: min(820px, calc(100% - 32px));
  max-height: calc(100% - 48px); background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow);

  const withName = ex.nameFormat !== "none";
  const header = ["Student Number", ...(withName ? ["Student Name"] : []), ...comps.map((c) => `${c.standard} (${typeLbl})`)];
  const overall = ex.overall && comps.length > 1;
  if (overall) header.push(`Overall (${typeLbl})`);
  const rows = [], skipped = [];
  let cells = 0;
  roster(sectionId).forEach((st) => {
    const levels = comps.map((c) => entryForAssessment(st.id, c.id, a.id)?.level ?? null);
    if (levels.every((l) => l == null) && !ex.includeBlank) { skipped.push(st); return; }
    const nm = ex.nameFormat === "firstLast" ? `${st.first} ${st.last}` : `${st.last}, ${st.first}`;
    const row = [st.id, ...(withName ? [nm] : []), ...levels.map((l) => (l == null ? "" : exportValue(l, ex)))];
    if (overall) {
      const got = levels.filter((l) => l != null);
      row.push(got.length ? Math.round(mean(got.map((l) => exportValue(l, ex))) * 100) / 100 : "");
    }
    cells += levels.filter((l) => l != null).length;
    rows.push(row);
  });
  const text = [header, ...rows].map((r) => r.map(csvCell).join(",")).join("\r\n") + "\r\n";

}
/* Support flags appear only when Settings › Reviewer view › "Include support flags (de-identified)" is on. */

/* Subgroup summary for equity analysis; groups under 10 students are suppressed. */
function subgroupSummary(sectionId) {
  const list = roster(sectionId);
  const groups = [["IEP", (f) => f.iep], ["504", (f) => f.p504], ["ML (active or monitored)", (f) => /^Active|^Monitored/.test(f.ml)], ["Former ML", (f) => /^Former/.test(f.ml)], ["No IEP, 504, or ML flag", (f) => !f.iep && !f.p504 && !/^Active|^Monitored/.test(f.ml)], ["All students", () => true]];
  return groups.map(([name, test]) => {
    const ms = list.filter((st) => test(supportFlags(st.id))).map(metrics).filter((m) => m.policyPct != null);
    const n = ms.length;
    if (n < 10) return { name, n: "<10", mastery: "<10", baseline: "<10", gap: "<10" };
    const withBase = ms.filter((m) => m.legacyPct != null);
    return { name, n, mastery: Math.round(mean(ms.map((m) => m.policyPct))), baseline: withBase.length ? Math.round(mean(withBase.map((m) => m.legacyPct))) : "–",
      gap: withBase.length ? (mean(withBase.map((m) => m.delta)) >= 0 ? "+" : "") + mean(withBase.map((m) => m.delta)).toFixed(1) : "–" };
  });
}

/* ---------- SMT codebook (dissertation appendix) ---------- */
function codebookRows() {
  const { seen } = smtAudit();
  const doms = new Map(), types = new Map(), decays = new Map();
  COMPETENCIES.forEach((c) => {
    const p = smtParts(c, { level: 3, date: "2026-01-01", method: "P" });
    if (!doms.has(p[0][1])) doms.set(p[0][1], new Set()); doms.get(p[0][1]).add(c.domain || c.framework);
    if (!types.has(p[2][1])) types.set(p[2][1], new Set()); types.get(p[2][1]).add(c.standard);
    decays.set(p[3][1], (decays.get(p[3][1]) || 0) + 1);
  });
  const inUse = (field, code) => (seen[field].has(code) ? "yes" : "defined, no evidence yet");
  const rows = [["field", "positions", "code", "meaning", "in_use"]];
  doms.forEach((v, k) => rows.push(["Domain", "1-3", k, [...v].join("; "), inUse("domain", k)]));
  rows.push(["Comp", "4-7", "####", "Competency number within the domain (zero-padded)", ""]);
  types.forEach((v, k) => rows.push(["Type", "8-10", k, `Evidence type for ${[...v].slice(0, 6).join(", ")}${v.size > 6 ? ", …" : ""}`, inUse("type", k)]));
  const DECAY = { "00": "No decay", "01": "Slow decay", "02": "Standard decay (default)", "03": "Fast decay" };
  decays.forEach((v, k) => rows.push(["Decay", "11-12", k, DECAY[k] || "Local decay code", inUse("decay", k)]));
  [1, 2, 3, 4].forEach((l) => rows.push(["Proficiency", "13-14", LEVELS[l].smt, `Level ${l} ${LEVELS[l].name}`, "yes"]));
  rows.push(["Separator", "15", "-", "Hyphen", "yes"]);
  rows.push(["Date", "16-23", "YYYYMMDD", "Date of the evidence that set the current level", "yes"]);
  Object.entries(METHODS).forEach(([k, m]) => rows.push(["Method", "24", k, m.name, "yes"]));
  const d = state.settings.district;
  rows.push(["District", "25-33", districtField(), `${ID_TYPES[d.idType].name}: ${ID_TYPES[d.idType].help}`, "yes"]);
  return rows;
}
function codebookCsv() { return csv([...codebookRows(), [], ["app_version", verNow(), "", "generated", genStamp().slice(0, 10)]]); }
function codebookMd() {

/* ---------- 1EdTech CLR 2.0 / Open Badges 3.0 credential (unsigned demo) ---------- */
function buildClr(st) {
  const d = state.settings.district;

  const issuer = { id: `${base}/issuers/${districtField()}`, type: ["Profile"], name: d.issuerName };
  const m = metrics(st);

  const issued = `${dates[dates.length - 1] || VIEW_DATE}T00:00:00Z`;
  const salt = state.settings.privacy.credentialSalt;
  const identifier = [{ type: "IdentityObject", identityHash: "sha256$" + sha256Hex(st.id + salt), identityType: "studentId", hashed: true, salt }];
  const creds = COMPETENCIES.filter((c) => m.per[c.id].att.length).map((c) => {

    const last = att[att.length - 1];

    }));

      "@context": ["https://www.w3.org/ns/credentials/v2", "https://purl.imsglobal.org/spec/ob/v3p0/context-3.0.3.json"],
      id: `urn:uuid:${nameUuid(`${st.id}|${c.id}|${salt}`)}`,
      type: ["VerifiableCredential", "OpenBadgeCredential"],
      issuer, validFrom: `${last.date}T00:00:00Z`, name: `${c.standard}: ${c.title}`,
      credentialSubject: {
        type: ["AchievementSubject"], identifier,
        achievement: {
          id: achId, type: ["Achievement"], achievementType: "Competency", name: `${c.standard}: ${c.title}`,
          description: c.target, criteria: { narrative: `Level 3 descriptor: ${c.rubric[3]}` },
          alignment: [
            { type: ["Alignment"], targetName: `${c.standard}: ${c.title}`, targetUrl: `${base}/frameworks/${c.framework.toLowerCase()}/${c.standard.toLowerCase()}`, targetCode: c.standard, targetFramework: (FRAMEWORKS.find((f) => f.id === c.framework) || {}).name || c.framework },
            ...(smtValid(smtString(c, last)) ? [{ type: ["Alignment"], targetName: "Standardized Mastery Taxonomy code", targetUrl: `${base}/frameworks/smt`, targetCode: smtString(c, last), targetFramework: "SMT (Uranis et al., 2019)" }] : [])
          ],
          resultDescription: [{
            id: rdId, type: ["ResultDescription"], name: "Mastery level", resultType: "RubricCriterionLevel",
            rubricCriterionLevel: [1, 2, 3, 4].map((n) => ({ id: `${achId}#level-${n}`, type: ["RubricCriterionLevel"], name: `${n} ${LEVELS[n].name}`, description: c.rubric[n], level: String(n) }))
          }]
        },

      },
      evidence
    };
  });
  return {
    "@context": ["https://www.w3.org/ns/credentials/v2", "https://purl.imsglobal.org/spec/clr/v2p0/context-2.0.1.json", "https://purl.imsglobal.org/spec/ob/v3p0/context-3.0.3.json"],

    name: `Comprehensive Learner Record: ${SEC[st.sectionId].name} (${SEMESTERS.find((x) => x.id === SEC[st.sectionId].semester).name}, 2026–27)`,
    credentialSubject: { type: ["ClrSubject"], identifier, verifiableCredential: creds }
  };
}

/* ---------- quarterly progress review (plain-language, for sharing with staff) ---------- */
function quartersFor(sectionId) {
  const sem = SEC[sectionId].semester;
  return TERMS.filter((t) => t.semester === sem && t.start <= TODAY);
}
const reviewPeriods = (sectionId) => { const qs = quartersFor(sectionId); return qs.length ? [...qs.map((q) => ({ id: q.id, label: q.id })), { id: SEC[sectionId].semester, label: "Semester" }] : []; };
function studentReview(st, qid) {
  const sec = SEC[st.sectionId];
  const semObj = SEMESTERS.find((x) => x.id === qid);
  const q = semObj ? { id: semObj.id, name: semObj.name, start: semObj.start, end: semObj.end, isSemester: true } : TERMS.find((t) => t.id === qid) || TERMS.find((t) => t.id === termFor(TODAY));
  const start = q.start, end = q.end < TODAY ? q.end : TODAY, ongoing = q.end >= TODAY;
  const name = nameOf(st), first = state.settings.research.pseudonymsEverywhere && isResearch() ? name : st.first;
  const rows = [];
  let attempts = 0;
  const methods = { P: 0, A: 0, E: 0 };
  for (const c of COMPETENCIES) {
    const all = attemptsFor(st.id, c.id);
    const inQ = all.filter((a) => a.date >= start && a.date <= end);
    if (!inQ.length) continue;
    attempts += inQ.length;
    inQ.forEach((a) => methods[a.method]++);
    const before = all.filter((a) => a.date < start), upTo = all.filter((a) => a.date <= end);
    rows.push({ c, inQ, evEnd: evaluate(upTo), evStart: before.length ? evaluate(before) : null, firstInQ: inQ[0], last: upTo[upTo.length - 1] });
  }
  const taughtInQ = new Set(state.assessments.filter((a) => (a.sections || []).includes(st.sectionId) && a.date >= start && a.date <= end).flatMap((a) => a.comps));
  const missing = COMPETENCIES.filter((c) => taughtInQ.has(c.id) && !rows.some((r) => r.c.id === c.id));
  const lvl = (ev) => `${fmt1(ev.value)} ${LEVELS[ev.level].name}`;
  const label = (c) => `${c.title} (${c.standard})`;
  const strengths = rows.filter((r) => r.evEnd.level >= 3).sort((a, b) => b.evEnd.value - a.evEnd.value);
  const growth = rows.filter((r) => (r.evStart && r.evEnd.value > r.evStart.value) || (!r.evStart && r.inQ.length > 1 && r.evEnd.value > r.firstInQ.level));
  const slipped = rows.filter((r) => r.evStart && r.evEnd.value < r.evStart.value);
  const next = rows.filter((r) => r.evEnd.level <= 2).sort((a, b) => a.evEnd.value - b.evEnd.value);
  const counted = rows.filter((r) => countsInGrade(r.c));
  const pct = counted.length ? Math.round(mean(counted.map((r) => pctFromValue(r.evEnd.value)))) : null;
  const habits = (state.habits[st.id] || []).filter((h) => h.date <= end);
  const hNow = habits[habits.length - 1], hPrev = habits[habits.length - 2];
  const flags = COMPETENCIES.filter((c) => state.flags[`${st.id}|${c.id}`]?.on);
  const recent = rows.filter((r) => r.evEnd.level <= 2 && r.last.note).sort((a, b) => b.last.date.localeCompare(a.last.date))[0];
  const range = `${fmtDate(start)} – ${ongoing ? "today" : fmtDate(end)}`;
  const met = rows.filter((r) => r.evEnd.mastered).length;
  const overview = !rows.length
    ? `No evidence has been recorded for ${first} in ${q.id} yet.`
    : `${first} has ${attempts} piece${attempts === 1 ? "" : "s"} of evidence across ${rows.length} standard${rows.length === 1 ? "" : "s"} this quarter and is meeting or exceeding ${met} of them` +
      (pct != null ? `. Gradebook equivalent so far: ${letter(pct)} (${pct}%).` : ".") +
      ` Evidence came from ${[["P", "observations or conversations"], ["A", "products"], ["E", "tests or quizzes"]].filter(([k]) => methods[k]).map(([k, n]) => `${methods[k]} ${n}`).join(", ")}.`;
  const sections = [
    { h: "Strengths", empty: "No standards at Meets or above yet this quarter.", items: strengths.slice(0, 4).map((r) => `${label(r.c)}: ${lvl(r.evEnd)}`) },
    { h: "Growth this quarter", empty: "No change in level yet this quarter.", items: growth.slice(0, 4).map((r) => `${label(r.c)}: from ${r.evStart ? fmt1(r.evStart.value) : r.firstInQ.level} to ${fmt1(r.evEnd.value)}`) },
    { h: "Next steps", empty: `Every standard with evidence is at Meets or above. Next challenge: aim for level 4 on ${strengths.filter((r) => r.evEnd.level === 3).slice(0, 2).map((r) => r.c.title.toLowerCase()).join(" and ") || "current standards"}.`, items: next.slice(0, 4).map((r) => `${label(r.c)} is at ${lvl(r.evEnd)}. Next target: ${r.c.rubric[Math.min(4, r.evEnd.level + 1)]}`) }
  ];
  if (slipped.length) sections.push({ h: "Worth watching", empty: "", items: slipped.slice(0, 3).map((r) => `${label(r.c)}: went from ${fmt1(r.evStart.value)} to ${fmt1(r.evEnd.value)} on recent evidence`) });
  if (missing.length) sections.push({ h: "No evidence yet", empty: "", items: missing.map((c) => `${label(c)} was assessed this quarter, but ${first} has no score (absence or late enrollment).`) });
  const extras = [];
  if (hNow) extras.push(`Work habits: ${hNow.value} (rated ${fmtDate(hNow.date)}${hPrev ? `; previously ${hPrev.value}` : ""}). Work habits are reported separately from mastery.`);
  if (flags.length) extras.push(`Retries pending: ${flags.map((c) => c.standard).join(", ")}.`);
  if (recent) extras.push(`Recent teacher feedback (${recent.c.standard}, ${fmtDate(recent.last.date)}): "${recent.last.note}"`);
  /* Semester mode: a letter-ready narrative with evidence highlights. */
  let letterText = "", highlights = [];
  if (q.isSemester && rows.length) {
    const lc = (t) => (/^(Newton|Coulomb|Hamlet|Frankenstein|American|Foundational American|The Great)/.test(t) ? t : t.charAt(0).toLowerCase() + t.slice(1));
    const top = strengths.slice(0, 2).map((r) => lc(r.c.title));
    const bigGrowth = rows.map((r) => ({ r, gain: r.evEnd.value - r.inQ[0].level })).filter((x) => x.gain >= 1).sort((a, b) => b.gain - a.gain)[0];
    const hs = (state.habits[st.id] || []).filter((h) => h.date >= start && h.date <= end).map((h) => h.value);
    const habitLine = hs.length ? (new Set(hs).size === 1 ? `Work habits were rated ${hs[0]} at every progress report.` : `Work habits moved from ${hs[0]} to ${hs[hs.length - 1]} over the semester.`) : "";
    const quote = rows.filter((r) => r.evEnd.level >= 3).flatMap((r) => r.inQ.filter((a) => a.level >= 3 && a.note).map((a) => ({ a, c: r.c }))).sort((x, y) => y.a.level - x.a.level || y.a.date.localeCompare(x.a.date))[0];
    letterText = [
      `In ${q.name} of ${sec.name}, ${first} was assessed ${attempts} times across ${rows.length} standards and met or exceeded the standard on ${met} of them.`,
      top.length ? `${first}'s strongest work came in ${top.join(" and ")}.` : "",
      bigGrowth ? `${first} showed real growth in ${lc(bigGrowth.r.c.title)}, moving from ${LEVELS[bigGrowth.r.inQ[0].level].name.toLowerCase()} (${fmtDate(bigGrowth.r.inQ[0].date, { month: "long" })}) to ${LEVELS[bigGrowth.r.evEnd.level].name.toLowerCase()} by ${fmtDate(bigGrowth.r.last.date, { month: "long" })}.` : "",
      quote ? `On ${quote.a.aid && assessmentById(quote.a.aid) ? `the ${assessmentById(quote.a.aid).title.toLowerCase()}` : "a recent assessment"}, my feedback noted: "${quote.a.note}"` : "",
      habitLine
    ].filter(Boolean).join(" ");
    highlights = rows.flatMap((r) => r.inQ.filter((a) => a.level >= 3).map((a) => ({ a, c: r.c }))).sort((x, y) => y.a.level - x.a.level || y.a.date.localeCompare(x.a.date)).slice(0, 4)
      .map(({ a, c }) => `${fmtDate(a.date)} · ${a.aid && assessmentById(a.aid) ? assessmentById(a.aid).title : METHODS[a.method].name} (${c.standard}, level ${a.level})${a.note ? `: "${a.note}"` : ""}${a.artifactUrl ? ` ${a.artifactUrl}` : ""}`);
    sections.unshift({ h: "Evidence highlights", empty: "No evidence at Meets or above yet.", items: highlights });
  }
  const footer = `Levels use the ${RULES[currentPolicy().rule].name.toLowerCase()} rule on a 1–4 scale (3 = meets the standard). Generated by the SMT Mastery Dashboard v${verNow()} (grading policy v${policyVersionNow()}) on ${fmtDate(TODAY, { month: "long", day: "numeric", year: "numeric" })}.`;
  const heading = `${q.isSemester ? "Semester review" : "Progress review"}: ${name}`;
  const sub = `${sec.name} (${sec.period}) · ${q.isSemester ? q.name : q.id}, ${range}${ongoing ? " (in progress)" : ""}`;
  const text = [heading, sub, "", ...(letterText ? ["Summary for letters of recommendation", letterText, ""] : []), "Overview", overview, "",
    ...sections.flatMap((s) => [s.h, ...(s.items.length ? s.items.map((i) => `• ${i}`) : [`• ${s.empty}`]), ""]),
    ...(extras.length ? [...extras, ""] : []), footer].join("\n");
  return { q, range, ongoing, overview, sections, extras, footer, text, heading, sub, rows, letter: letterText };
}

state.ui = Object.assign({}, uiDefaults(), state.ui || {});

const isResearch = () => state.settings.mode === "research";

function nameOf(st) {
  const s = state.settings;
  if (isResearch() && s.research.pseudonymsEverywhere) return pseudonym(st.id);
  if (s.privacy.nameFormat === "firstInitial") return `${st.first} ${st.last[0]}.`;
  if (s.privacy.nameFormat === "lastFirst") return `${st.last}, ${st.first}`;
  return `${st.first} ${st.last}`;
}
/* Level label that shortens on phones ("2 Appr.") and truncates instead of overlapping; the full name stays in title/aria-label. */
function lvLabel(l, withNum = true) {
  const full = `${withNum ? l + " " : ""}${LEVELS[l].name}`, short = `${withNum ? l + " " : ""}${LEVELS[l].abbr}`;
  return `<span class="lvl-txt" title="${esc(`${l} ${LEVELS[l].name}`)}"><span class="lvl-full">${esc(full)}</span><span class="lvl-short">${esc(short)}</span></span>`;
}
/* A3 warning: Level 1 on a graded standard but a passing letter. */
function warnChip(m, compact) {
  if (!m.warnL1Pass) return "";
  const stds = m.l1Graded.map((c) => c.standard).join(", ");
  const msg = `Level 1 (Not yet) on ${stds}, but the course letter ${m.policyLetter} is passing (pass line ${passLineLetter()}).`;
  return ` <span class="pill warn" title="${esc(msg)}" aria-label="${esc(msg)}"${tip("warn-l1")}>⚠${compact ? "" : " Level 1 but passing"}</span>`;
}
const baselineVs = () => BASELINES[currentPolicy().baseline].vs;
const baselineShort = () => ({ anchors: "same-table average", rawPoints: "raw-points avg", imported: "reported %" })[currentPolicy().baseline];
function chip(ev, compact) {
  if (!ev || ev.value == null) return `<span class="lv lv-0"><span class="n">–</span>${compact ? "" : "No evidence"}</span>`;
  const v = fmt1(ev.value);
  const label = compact ? "" : lvLabel(ev.level, false) + (ev.confirmed ? "" : '<span class="lvl-conf"> · confirm</span>');
  return `<span class="lv lv-${ev.level}" title="${esc(LEVELS[ev.level].long)}${ev.confirmed ? "" : " (needs a second confirming attempt)"}" aria-label="${esc(`${v} ${LEVELS[ev.level].name}${ev.confirmed ? "" : ", needs confirming"}`)}"><span class="n">${v}</span>${label}</span>`;
}
function distBar(d) {
  const tot = d[0] + d[1] + d[2] + d[3] + d[4] || 1;
  const seg = (k) => (d[k] ? `<span class="d${k}" style="width:${(d[k] / tot) * 100}%" title="Level ${k}: ${d[k]}"></span>` : "");
  return `<div class="dist" role="img" aria-label="Level 1: ${d[1]}, 2: ${d[2]}, 3: ${d[3]}, 4: ${d[4]}, no evidence: ${d[0]}">${seg(1)}${seg(2)}${seg(3)}${seg(4)}</div>`;
}

const semSections = () => SECTIONS.filter((s) => s.semester === ui.semester);

}).join("");

const fwShort = (id) => FRAMEWORKS.find((f) => f.id === id).short;

function fwFilter(comps) { if (ui.fw !== "all" && !FRAMEWORKS.some((f) => f.id === ui.fw)) ui.fw = "all"; return ui.fw === "all" ? comps : comps.filter((c) => c.framework === ui.fw); }

/* ---------------------------------------------------------------- Header */

  const s = state.settings;
  document.getElementById("tabs").innerHTML = TABS.map((t) =>
    `<button class="tab" role="tab" aria-selected="${ui.tab === t.id}" data-act="tab" data-tab="${t.id}"${tip("tab", t.id)}>${t.label}</button>`).join("");

/* ---------------------------------------------------------------- Today */
function viewToday() {
  if (ui.todayView === "queue") return retryQueuePage();
  const cards = semSections().map((sec) => {
    const { byComp, intensive, list, comps } = groupsForSection(sec.id);
    if (!comps.length) {
      const firstA = state.assessments.filter((a) => (a.sections || []).includes(sec.id)).sort((a, b) => a.date.localeCompare(b.date))[0];
      return `<article class="card sec-card"${tip("sec-card", sec.id)}>
        <div class="spread"><span class="when">${esc(sec.period)} · ${esc(sec.time)}</span><span class="small faint">${esc(sec.room || "")}${sec.custom ? ' · <span class="pill">Added</span>' : ""}</span></div>
        <div><h3>${esc(sec.name)}</h3><p class="small muted">${list.length} student${list.length === 1 ? "" : "s"} enrolled · starts ${fmtDate(semesterStart(sec.semester), { weekday: "short", month: "short", day: "numeric" })}</p></div>
        <p class="small">${firstA ? `First assessment: <b>${esc(firstA.title)}</b> (${fmtDate(firstA.date)}).` : "No assessments planned yet."} Levels, groups, and retries will appear once scoring begins.</p>
        <div class="row tight"><button class="btn" data-act="go" data-tab="students" data-sec="${sec.id}">View roster</button><button class="btn ghost" data-act="go-plan" data-sec="${sec.id}">Plan an assessment</button>${sec.custom ? `<button class="btn ghost danger" data-act="remove-class" data-sec="${sec.id}">Remove class</button>` : ""}</div>
      </article>`;
    }
    const d = { 0: 0, 1: 0, 2: 0, 3: 0, 4: 0 };
    let mastered = 0, assessed = 0, flags = 0;
    const l1Students = new Set();
    list.forEach((st) => {
      const m = metrics(st);
      comps.forEach((c) => {
        const ev = m.per[c.id].ev; d[ev.level]++;
        if (ev.value != null) { assessed++; if (ev.mastered) mastered++; }
        if (ev.level === 1) l1Students.add(st.id);
        if (state.flags[`${st.id}|${c.id}`]?.on) flags++;
      });
    });
    const nextA = state.assessments.filter((a) => a.sections.includes(sec.id) && a.date > TODAY).sort((a, b) => a.date.localeCompare(b.date))[0];
    const rate = assessed ? Math.round((mastered / assessed) * 100) : 0;
    const nSup = list.filter((st) => supportOf(st.id)?.plan).length, nMl = list.filter((st) => mlActive(st.id)).length;
    const sel = ui.rq.cls === sec.id;
    return `<article class="card sec-card clickable ${sel ? "selected" : ""}" data-act="rq-card" data-sec="${sec.id}" aria-label="Open the retry queue for ${esc(sec.period)} ${esc(sec.name)}"${tip("sec-card", sec.id)}>
      <div class="spread"><span class="when">${esc(sec.period)} · ${esc(sec.time)}</span><span class="small faint">${esc(sec.room || "")}</span></div>
      <div><h3>${esc(sec.name)}</h3><p class="small muted">${list.length} students${nSup ? ` · ${nSup} with IEP/504` : ""}${nMl ? ` · ${nMl} ML` : ""} · ${comps.length} standards taught so far${nextA ? ` · next: ${esc(nextA.title)} (${fmtDate(nextA.date)})` : ""}</p></div>
      <div class="stack" style="gap:6px"${tip("dist")}>${distBar(d)}<span class="tiny muted">${rate}% of assessed standards at Meets or above${d[0] ? ` · ${d[0]} not yet assessed` : ""}</span></div>
      <div class="facts">
        <div${tip("fact-l1")}><b>${l1Students.size}</b><span>need re-teaching</span></div>
        <div${tip("fact-retries")}><b>${flags}</b><span>retries waiting</span></div>
        <div${tip("fact-mtss")}><b>${intensive.length}</b><span>for MTSS review</span></div>
      </div>
      <div class="row tight"><button class="btn primary" data-act="go" data-tab="score" data-sec="${sec.id}">Score this class</button>
      <button class="btn" data-act="go" data-tab="class" data-sec="${sec.id}">See groups</button>${sec.custom ? `<button class="btn ghost danger" data-act="remove-class" data-sec="${sec.id}">Remove class</button>` : ""}</div>
    </article>`;
  }).join("");
  const hasScores = semSections().some((s) => activeComps(s.id).length);
  return `<div class="page-head"><div><div class="kicker">${fmtDate(TODAY, { weekday: "long", month: "long", day: "numeric" })} · ${semesterFor(TODAY) === "S1" ? `Week ${schoolWeek()} of Semester 1` : `Week ${Math.floor((dayNum(TODAY) - dayNum(semesterStart("S2"))) / 7) + 1} of Semester 2`} · ${termFor(TODAY)}</div><h2 data-tip="page-today">${ui.semester === semesterFor(TODAY) ? "Your classes today" : `${esc(semName(ui.semester))} classes`}</h2></div><div class="row">${LEGEND}${semesterPicker()}<button class="btn" data-act="add-class" data-tip="add-class">${ICON.plus} Add class</button></div></div>
    <section class="sections">${cards}</section>
    ${hasScores ? retrySummaryCard() : ""}`;
}
/* Today shows the five most urgent retries; the full queue is its own page (Today › Retry queue). */
function retrySummaryCard() {
  const all = retryItems();
  const top = [...all].sort((a, b) => (a.ev.level ?? 9) - (b.ev.level ?? 9) || a.f.date.localeCompare(b.f.date)).slice(0, 5);
  return `<section class="card flush" id="retry-summary">
    <div class="card-head spread"><div data-tip="retry-summary"><h3>Retries to handle first</h3><p class="small muted">${all.length ? `Level 1 first, then the longest waiting. Scoring 3 or higher clears a flag.` : "No retries waiting."}</p></div>
      ${all.length ? `<button class="btn" data-act="rq-open">Open retry queue (${all.length})</button>` : ""}</div>
    ${top.length ? `<div class="table-wrap"><table><thead><tr><th>Student</th><th>Class</th><th>Standard</th><th>Current</th><th>Flagged</th><th></th></tr></thead><tbody>${top.map((x) => retryRow(x, "")).join("")}</tbody></table></div>` : ""}
  </section>`;
}
function rqChips() {
  const rq = ui.rq, chips = [];
  if (rq.cls !== "all" && SEC[rq.cls]) chips.push(["cls", `${SEC[rq.cls].period} · ${SEC[rq.cls].name}`]);
  if (rq.fw !== "all") chips.push(["fw", fwShort(rq.fw)]);
  if (rq.level !== "all") chips.push(["level", `Level ${rq.level}`]);
  if ((rq.q || "").trim()) chips.push(["q", `“${rq.q.trim()}”`]);
  return chips.map(([k, l]) => `<button class="chipx" data-act="rq-chip" data-k="${k}" aria-label="Remove filter ${esc(l)}">${esc(l)} <span aria-hidden="true">×</span></button>`).join("");
}
function retryQueuePage() {
  const rq = ui.rq, total = retryItems().length, shown = retryFiltered().length;
  const opt = (v, l, cur) => `<option value="${v}" ${cur === v ? "selected" : ""}>${l}</option>`;
  if (rq.cls !== "all" && !SEC[rq.cls]) rq.cls = "all";
  const nActive = ["cls", "fw", "level"].filter((k) => rq[k] !== "all").length;
  return `<div class="page-head"><div><button class="linklike small" data-act="rq-back">← Back to Today</button><h2 data-tip="retry-queue">Retry queue</h2>
      <p class="small muted">Students flagged for another attempt in ${esc(semName(ui.semester))}. Scoring 3 or higher clears the flag automatically.</p></div>
      <span class="pill flag" id="rq-count">${shown === total ? `${total} waiting` : `${shown} of ${total}`}</span></div>
    <section class="card flush" id="retry-queue">
      <div class="card-head rq-bar" data-tip="rq-controls">
        <input type="search" id="rq-search" placeholder="Search student or standard" value="${esc(rq.q)}" aria-label="Search retries">
        <details class="menu-pop rq-filter" ${ui.rqFilterOpen ? "open" : ""} data-act="rq-filter-toggle"><summary class="btn">Filter &amp; sort${nActive ? ` <span class="pill">${nActive}</span>` : ""}</summary>
          <div class="menu-panel rq-controls">
            <label class="field" for="rq-group">Group by<select id="rq-group" data-act="rq" data-k="group">${opt("standard", "Standard within class", rq.group)}${opt("class", "Class", rq.group)}${opt("student", "Student", rq.group)}${opt("none", "No grouping", rq.group)}</select></label>
            <label class="field" for="rq-cls">Class<select id="rq-cls" data-act="rq" data-k="cls">${opt("all", "All classes", rq.cls)}${semSections().map((s) => opt(s.id, `${s.period} · ${s.name}`, rq.cls)).join("")}</select></label>
            <label class="field" for="rq-fw">Standards<select id="rq-fw" data-act="rq" data-k="fw">${opt("all", "All", rq.fw)}${FRAMEWORKS.map((f) => opt(f.id, f.short, rq.fw)).join("")}</select></label>
            <label class="field" for="rq-level">Current level<select id="rq-level" data-act="rq" data-k="level">${opt("all", "Any", rq.level)}${opt("1", "1 Not yet", rq.level)}${opt("2", "2 Approaching", rq.level)}</select></label>
            <label class="field" for="rq-sort">Sort by<select id="rq-sort" data-act="rq" data-k="sort">${opt("student", "Student name", rq.sort)}${opt("standard", "Standard", rq.sort)}${opt("level", "Lowest level first", rq.sort)}${opt("oldest", "Flagged longest ago", rq.sort)}${opt("newest", "Flagged most recently", rq.sort)}</select></label>
          </div></details>
        <div class="chips" id="rq-chips">${rqChips()}</div>
      </div>
      <div id="rq-body">${retryBody()}</div>
    </section>`;
}

/* ---------- interactive retry queue ---------- */
function retryItems() {
  const items = [];
  Object.entries(state.flags).forEach(([k, f]) => {
    if (!f.on) return;
    const [sid, cid] = k.split("|");
    const st = studentById(sid);
    if (!st || !COMP[cid] || SEC[st.sectionId].semester !== ui.semester) return;
    items.push({ st, c: COMP[cid], ev: metrics(st).per[cid].ev, f, k });
  });
  return items;
}
function retryFiltered() {
  const rq = ui.rq;
  if (rq.fw !== "all" && !FRAMEWORKS.some((f) => f.id === rq.fw)) rq.fw = "all";
  const q = (rq.q || "").trim().toLowerCase();
  let items = retryItems().filter((x) => (rq.cls === "all" || x.st.sectionId === rq.cls) && (rq.fw === "all" || x.c.framework === rq.fw) &&
    (rq.level === "all" || String(x.ev.level) === rq.level) &&
    (!q || nameOf(x.st).toLowerCase().includes(q) || x.c.standard.toLowerCase().includes(q) || x.c.title.toLowerCase().includes(q)));
  const by = { student: (a, b) => a.st.last.localeCompare(b.st.last) || a.st.first.localeCompare(b.st.first),
    standard: (a, b) => a.c.standard.localeCompare(b.c.standard) || a.st.last.localeCompare(b.st.last),
    level: (a, b) => (a.ev.value ?? 9) - (b.ev.value ?? 9) || a.st.last.localeCompare(b.st.last),
    oldest: (a, b) => a.f.date.localeCompare(b.f.date), newest: (a, b) => b.f.date.localeCompare(a.f.date) };
  return items.sort(by[rq.sort] || by.student);
}
function retryRow(x, hide) {
  return `<tr${tip("retry", x.k)}>
    ${hide === "student" ? "" : `<td class="name"><button class="linklike" data-act="student" data-sid="${x.st.id}">${esc(nameOf(x.st))}</button></td>`}
    ${hide === "class" || hide === "standard" ? "" : `<td class="small">${esc(SEC[x.st.sectionId].period)}</td>`}
    ${hide === "standard" ? "" : `<td><span class="small"><b>${esc(x.c.standard)}</b> <span class="muted">${esc(x.c.title)}</span></span></td>`}
    <td>${chip(x.ev)}</td>
    <td class="small muted">${fmtDate(x.f.date)}</td>
    <td style="text-align:right;white-space:nowrap"><button class="btn sm" data-act="drawer" data-sid="${x.st.id}" data-cid="${x.c.id}">Record retry</button>
      <button class="btn sm ghost" data-act="flag" data-sid="${x.st.id}" data-cid="${x.c.id}" title="Remove this flag">Clear</button></td>
  </tr>`;
}
function retryBody() {
  const items = retryFiltered(), g = ui.rq.group;
  if (!items.length) return `<div class="empty">${retryItems().length ? "No retries match these filters." : "No retries waiting."}</div>`;
  const head = (hide) => `<thead><tr>${hide === "student" ? "" : "<th>Student</th>"}${hide === "class" || hide === "standard" ? "" : "<th>Class</th>"}${hide === "standard" ? "" : "<th>Standard</th>"}<th>Current</th><th>Flagged</th><th></th></tr></thead>`;

  const keyOf = { standard: (x) => `${x.st.sectionId}|${x.c.id}`, class: (x) => x.st.sectionId, student: (x) => x.st.id }[g];
  const groups = new Map();
  items.forEach((x) => { const k = keyOf(x); if (!groups.has(k)) groups.set(k, []); groups.get(k).push(x); });

function progressSvg(att, ev, start = FIRST_DAY) {
  const W = 240, H = 84, padL = 18, padR = 26, padT = 6, padB = 16;
  const d0 = dayNum(start), d1 = Math.max(Math.min(dayNum(TODAY), dayNum(addDays(start, 150))) + 7, ...att.map((a) => dayNum(a.date) + 7));
  const x = (iso) => padL + ((dayNum(iso) - d0) / (d1 - d0)) * (W - padL - padR);
  const y = (l) => padT + ((4 - l) / 3) * (H - padT - padB);

}

  if (!terms.includes(ui.ptpBundleTerm)) ui.ptpBundleTerm = terms.includes(termFor(TODAY)) ? termFor(TODAY) : sec.semester;
  const items = ptpTermAssessments(sec.id, ui.ptpBundleTerm);
  return `<div class="card stack" style="background:var(--surface-2);gap:10px" data-tip="bundle">
    <div class="spread"><div><h4>Export a quarter or the semester</h4><p class="small muted">One import file per scored assessment, plus a step list, in a single .zip. Uses the score settings above.</p></div>
      <div class="row"><label class="field" for="ptp-term">Period<select id="ptp-term" data-act="ptp-bundle-term">${terms.map((t) => `<option value="${t}" ${t === ui.ptpBundleTerm ? "selected" : ""}>${t.startsWith("S") ? `${t} (whole semester)` : t}</option>`).join("")}</select></label>
      <button class="btn primary" data-act="dl-bundle" style="align-self:flex-end" ${items.length ? "" : "disabled"}>${ICON.download} Download ${items.length} file${items.length === 1 ? "" : "s"} (.zip)</button></div></div>
    ${items.length ? `<ul class="tiny muted" style="margin:0;padding-left:18px;columns:2;column-gap:24px">${items.map(({ a, x }) => `<li>${fmtDate(a.date)} · ${esc(a.title)} <span class="faint">(${x.rows.length} students, ${x.comps.length} col)</span></li>`).join("")}</ul>` : `<p class="small muted">No scored assessments in ${esc(ui.ptpBundleTerm)} yet.</p>`}
  </div>`;
}
function exportSettingsCard() {
  const ex = state.settings.export;
  const opt = (v, l, cur) => `<option value="${v}" ${String(cur) === String(v) ? "selected" : ""}>${l}</option>`;
  const conv = [1, 2, 3, 4].map((l) => `<span class="conv-pill l${l}"><b>${l}</b> → ${exportValue(l)}</span>`).join("");
  return `<div class="card stack export-settings" data-tip="export-settings">
    <h4>Score settings</h4>
    <div class="es-grid">
      <label class="field" for="ex-type">Score type<select id="ex-type" data-setting="export.scoreType">${Object.entries(EXPORT_TYPES).map(([k, v]) => opt(k, v.name, ex.scoreType)).join("")}</select></label>
      ${ex.scoreType === "points" ? `<label class="field" for="ex-total">Point total<input id="ex-total" type="number" min="1" max="1000" step="1" data-setting="export.total" value="${esc(ex.total)}"></label>
      <label class="field" for="ex-map">Convert levels by<select id="ex-map" data-setting="export.mapping">${opt("anchors", `Conversion anchors (3 → ${state.settings.policy.anchors[3]}% of total)`, ex.mapping)}${opt("proportional", "Proportional (level ÷ 4 × total)", ex.mapping)}</select></label>` : ""}
      <label class="field" for="ex-name">Student name column<select id="ex-name" data-setting="export.nameFormat">${opt("lastFirst", "Last, First", ex.nameFormat)}${opt("firstLast", "First Last", ex.nameFormat)}${opt("none", "Leave out", ex.nameFormat)}</select></label>
    </div>
    <div class="row">
      <label class="check small"><input type="checkbox" data-setting="export.overall" ${ex.overall ? "checked" : ""}> Add an overall column when an assessment covers several standards</label>
      <label class="check small"><input type="checkbox" data-setting="export.includeBlank" ${ex.includeBlank ? "checked" : ""}> Include students with no score (blank rows)</label>
    </div>
    <div class="conv"><span class="small muted">Each level exports as</span> ${conv} <span class="small muted">· set File Score Type to <b>${EXPORT_TYPES[ex.scoreType].file}</b>${ex.scoreType === "points" ? ` and the assessment to <b>${ex.total} points</b>` : ex.scoreType === "level" ? " and the assessment to <b>4 points</b>" : ""}</span></div>
  </div>`;
}
function ptpSection(sec) {
  const ex = state.settings.export;
  const done = state.assessments.filter((a) => (a.sections || []).includes(sec.id) && a.date <= TODAY).sort((a, b) => b.date.localeCompare(a.date));
  if (!done.some((a) => a.id === ui.ptpAssessment)) ui.ptpAssessment = done[0] ? done[0].id : null;
  if (!ui.ptpAssessment) return `<section class="card empty">No assessments yet for this class.</section>`;
  const x = ptpImport(sec.id, ui.ptpAssessment);
  const a = x.a;
  const ros = roster(sec.id);
  const term = termFor(a.date);
  const warn = [];
  if (term !== termFor(TODAY)) warn.push(`This assessment is in ${term}. PowerTeacher Pro blocks imports when the reporting term or class is locked; ask your administrator if ${term} is closed.`);
  if (x.skipped.length) warn.push(`${x.skipped.length} student${x.skipped.length > 1 ? "s have" : " has"} no score on this assessment and ${x.skipped.length > 1 ? "are" : "is"} left out of the file: ${x.skipped.map((s) => esc(nameOf(s))).join(", ")}.`);
  const partial = x.rows.filter((r) => r.slice(x.firstScoreCol, x.firstScoreCol + x.comps.length).some((v) => v === "")).length;
  if (partial) warn.push(`${partial} row${partial > 1 ? "s have" : " has"} a blank cell for at least one standard. Choose “keep existing scores” when importing if you don't want blanks to matter.`);
  if (x.comps.length > 1) warn.push(`This assessment covers ${x.comps.length} standards, so the file has ${x.comps.length} score columns. Each import brings in one column: repeat the import for each matching assessment in PowerTeacher Pro and pick that standard's column.`);
  const preview = x.rows.map((r) => `<tr>${r.map((v, i) => `<td class="${i >= x.firstScoreCol ? "num" : ""} small">${esc(v === "" ? "–" : v)}</td>`).join("")}</tr>`).join("");
  const steps = [
    `In PowerTeacher Pro, open <b>Grading › Assignment List</b> (PowerTeacher Pro's list of assessments) and select the one that matches <b>${esc(a.title)}</b>${x.comps.length > 1 ? " (or the one for the standard you are importing)" : ""}.`,
    `Click the gear icon and choose <b>Import Scores</b>, then <b>Browse Files</b> and pick the file you saved.`,
    `Set <b>Format</b> to <b>CSV</b>. Leave <b>Include First Row</b> unchecked: the first row is a header.`,
    `Set <b>File Score Type</b> to <b>${EXPORT_TYPES[ex.scoreType].file}</b>${ex.scoreType === "points" ? ` (scores are out of ${ex.total}; set the assessment to ${ex.total} points in PowerTeacher Pro)` : ex.scoreType === "level" ? " (scores are 1–4; set the assessment to 4 points in PowerTeacher Pro)" : ""}. If the PowerTeacher Pro assessment uses a different score type, PowerTeacher Pro converts the scores.`,
    ex.nameFormat === "none" ? `Leave <b>Validate Student Names</b> unchecked (this file has no name column), then click <b>Next</b> and review any alerts.` : `Check <b>Validate Student Names</b> so mismatches between names and student numbers are flagged, then click <b>Next</b> and review any alerts.`,
    `${x.comps.length > 1 ? "Click the column header for the standard you are importing. " : ""}Choose whether to keep or overwrite existing scores, and whether to keep or recalculate existing standards scores. Then click <b>Import</b>.`
  ];
  return `<section class="card stack">
    <div class="spread"><div data-tip="ptp"><h3>PowerTeacher Pro score import</h3><p class="small muted">One file per assessment, matched to students by student number. Choose the assessment and score settings, check the preview, then download.</p></div></div>
    <label class="field" for="ptp-assessment"${tip("assessment", a.id)} style="max-width:520px">Assessment<select id="ptp-assessment" data-act="ptp-assessment">${done.map((d) => `<option value="${d.id}" ${d.id === a.id ? "selected" : ""}>${fmtDate(d.date)} · ${esc(d.title)} (${termFor(d.date)})</option>`).join("")}</select></label>
    ${exportSettingsCard()}
    <div class="stats" data-tip="ptp-stats">
      <div class="stat"><span class="v">${x.rows.length}<span class="small muted">/${ros.length}</span></span><span class="k">students in file</span></div>
      <div class="stat"><span class="v">${x.comps.length}</span><span class="k">score column${x.comps.length > 1 ? "s" : ""}</span></div>
      <div class="stat"><span class="v">${x.cells}</span><span class="k">scores</span></div>
      <div class="stat"><span class="v">${esc(METHODS[a.method].short)}</span><span class="k">${fmtDate(a.date)} · ${term}</span></div>
    </div>
    ${warn.length ? `<ul class="small" style="margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px">${warn.map((w) => `<li>${w}</li>`).join("")}</ul>` : ""}
    <details class="disclose" data-act="ptp-preview-toggle" ${(transient.ptpOpen ?? !state.ptpPreviewSeen) ? "open" : ""}><summary>File preview (${x.rows.length} row${x.rows.length === 1 ? "" : "s"} plus a header)</summary>
    <div class="table-wrap preview-wrap" data-tip="ptp-preview" style="margin-top:8px"><table><thead><tr>${x.header.map((h) => `<th>${esc(h)}</th>`).join("")}</tr></thead><tbody>${preview}</tbody></table></div>
    <p class="tiny muted">Scroll the preview to check every student.</p></details>
    <div class="row">
      <button class="btn primary" data-act="dl-ptp" data-tip="dl-ptp" ${x.rows.length ? "" : "disabled"}>${ICON.download} Download CSV for this assessment</button>
      <button class="btn" data-act="copy-text" data-src="ptp-csv">${ICON.copy} Copy</button>
      <span class="tiny muted"><code>${esc(ptpFilename(sec.id, a))}</code> · UTF-8 CSV for Import Scores${canDownload() ? "" : ". Downloads are off in this view; use Copy and save the text as a .csv file"}</span></div>
    <textarea class="code hidden" id="ptp-csv" readonly aria-hidden="true">${esc(x.text)}</textarea>
    ${ptpBundleCard(sec)}
    <details class="disclose" data-tip="steps"><summary>How to import into PowerTeacher Pro (${steps.length} steps)</summary>
      <ol class="small" style="margin:8px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:6px">${steps.map((s) => `<li>${s}</li>`).join("")}</ol>
      <p class="tiny muted" style="margin-top:8px">Based on PowerSchool's “Importing and Exporting Scores” help page for PowerTeacher Pro. Your district's version and permissions may differ.</p></details>
  </section>`;
}

  const showAll = ui.showChanges || isResearch();

  const editing = transient.editing ? state.scores.find((e) => e.id === transient.editing) : null;

      ${s === "live" ? `<div class="row tight"><button class="btn sm ghost" data-act="edit-entry" data-eid="${e.id}">Correct</button><button class="btn sm ghost danger" data-act="void-entry" data-eid="${e.id}">Void</button></div>` : ""}

      <div class="row tight" style="margin-top:6px">${chip(ev)}</div></div>

          <label class="field full" for="f-url">Link to student work (optional)<input id="f-url" name="artifactUrl" type="url" value="${esc(f.artifactUrl)}" placeholder="https://"></label>

/* ---------------------------------------------------------------- Dialogs */
function renderDialog() {
  const host = document.getElementById("dialog-host");
  if (typeof drawCommentDots === "function") drawCommentDots(false);
  if (!transient.dialog) { host.innerHTML = ""; return; }
  if (transient.dialog === "settings") host.innerHTML = settingsDialog();
  else if (transient.dialog === "new-assessment") host.innerHTML = newAssessmentDialog();
  else if (transient.dialog === "edit-assessment") host.innerHTML = newAssessmentDialog(assessmentById(transient.editAid));
  else if (transient.dialog === "add-class") host.innerHTML = addClassDialog();
  else if (transient.dialog === "add-standard") host.innerHTML = addStandardDialog();
  else if (transient.dialog === "supports") host.innerHTML = supportsDialog();
  else if (transient.dialog === "welcome") host.innerHTML = welcomeDialog();
  else if (transient.dialog === "reset-confirm") host.innerHTML = resetConfirmDialog();
  else if (["feedback", "send-feedback", "choices"].includes(transient.dialog)) host.innerHTML = feedbackDialog();
  else if (transient.dialog === "how-grades") host.innerHTML = gradesDialog();
}

function howItWorks() {
  const s = state.settings, p = s.policy;
  const counted = FRAMEWORKS.filter((f) => p.gradeFrameworks[f.id]).map((f) => f.short).join(" + ") || "no frameworks";
  const ex = { level: 3, date: "2026-10-22", method: "P" };
  return [
    ["Evidence comes in", `<p>Every score is an entry: student, standard, assessment, level 1–4, evidence type (observation or conversation, product, or test), date, feedback, and an optional link to student work.</p><p>Entries are never overwritten. A correction creates a new entry that supersedes the old one, and Undo or Void marks an entry inactive, so the full history is always available.</p>`],
    ["Mastery is tracked per standard", `<p>The current level on each standard comes from the grading rule, now <b>${esc(RULES[p.rule].name.toLowerCase())}</b>${p.rule === "recentN" ? ` (N = ${p.n})` : p.rule === "decaying" ? ` (weight ${p.weight})` : ""}. Later growth replaces early attempts instead of being averaged with them.</p><p>${p.confirm ? "Mastery also needs two pieces of evidence at 3 or above." : "An optional rule can require two pieces of evidence at 3 or above before a standard counts as mastered."} Rules are changed in Settings › Grading rule, and every view recalculates immediately.</p>`],
    ["Levels become gradebook scores", `<p>Levels convert to percentages through the anchors (1 → ${p.anchors[1]}, 2 → ${p.anchors[2]}, 3 → ${p.anchors[3]}, 4 → ${p.anchors[4]}); Level 1 sits below the passing line. The averaging comparison uses the <b>${esc(BASELINES[p.baseline].name.toLowerCase())}</b> baseline. The course percent averages the current levels of <b>${esc(counted)}</b> standards; the others are still scored and reported.</p><p>PowerSchool receives one import file per assessment, matched by student number.</p>`],
    ["Courses run by semester", `<p>Each course lasts one semester (S1: Aug 24–Jan 22; S2: Jan 25–Jun 15) on a four-period day: P1 7:50–9:10, P2 9:15–10:35, P3 10:40–12:40 (with lunch), P4 12:45–2:05. Semester 2 classes have different students. Switch semesters at the top of the page.</p><p>A standard appears in a class once an assessment for it has been given; later units stay under “coming later.” This sample uses: ${FRAMEWORKS.map((f) => esc(f.name)).join("; ")}.</p>`],
    ["Groups and retries update themselves", `<p>Re-teach and practice groups rebuild after every score. Students are suggested for MTSS review only with persistent need (“not yet” on ${s.groups.tier3Min}+ standards, or ${s.groups.persistentAttempts}+ attempts still at 1). Retry flags clear when a later score reaches 3.</p>`],
    ["Privacy", `<p>Data stays in this browser unless you download or copy it. Research exports drop names and student numbers and use salted SHA-256 pseudonyms. Research pseudonyms and credential hashes use separate salts, and the research salt never leaves the browser. Pseudonyms can replace names on screen for presentations (Settings › Research view).</p>`],
    ["The SMT code", `<p>Each current level is also encoded as a Standardized Mastery Taxonomy string (Uranis et al., 2019): domain, competency number, type, decay rule, proficiency, date, method, and district ID.</p>${smtBreakdown(COMPETENCIES[0], ex)}<p class="tiny" style="font-family:var(--font-body);color:var(--ink-2);margin-top:6px">The proficiency codes (02/04/06/08) and the decay field should be confirmed against the published taxonomy. District ID: ${esc(ID_TYPES[s.district.idType].name)}. Every code is checked for length 33, the hyphen at position 15, a real date, and a valid method before export.</p>${smtCheckHtml()}`]
  ];
}

function profileCard() {

  </section>`;

function telemetrySummary() {
  const ev = state.telemetry;
  const sc = ev.filter((e) => e.type === "score");
  const gaps = [];
  for (let i = 1; i < sc.length; i++) { const g = (sc[i].t - sc[i - 1].t) / 1000; if (g > 0 && g < 120) gaps.push(g); }
  return { scores: sc.length, corrections: ev.filter((e) => e.correction).length, voids: ev.filter((e) => e.type === "void" || e.type === "undo").length,
    exports: ev.filter((e) => e.type === "export").length, median: median(gaps), kbd: sc.length ? sc.filter((e) => e.kbd).length / sc.length : null };
}

function supPill(sid, compact) {
  const s = supportOf(sid);
  if (!s) return "";
  const hide = isResearch();
  let out = "";
  if (s.plan) {
    const detail = hide ? "Details hidden while research details are on" : s.accommodations.join(", ") + (s.modifications ? ` · Modifications: ${s.modifications}` : "");

/* ---------- Guide: five tasks, the same for every reviewer (self-checking) ---------- */
const TRY_TASKS = [
  { id: "score",   title: "Score a class",           how: "Give at least five students a level (keys 1–4 work).", go: "score" },
  { id: "student", title: "Open a student record",   how: "Pick any student and look at their levels.",          go: "students" },
  { id: "compare", title: "Compare the two grades",  how: "See one student's grade averaged vs. mastery.",       dialog: "how-grades" },
  { id: "export",  title: "Export a gradebook file", how: "Download a PowerSchool import file.",                 go: "gradebook" },
  { id: "send",    title: "Send your feedback",      how: "Answer 3 quick questions and send.",                  dialog: "send-feedback" }
];
function tryMark(id) {
  if (!state.tryThis || state.tryThis[id] || !TRY_TASKS.some((t) => t.id === id)) return;
  state.tryThis[id] = localIso();
  save();
  if (typeof toast === "function") setTimeout(() => { toast(`✓ ${TRY_TASKS.find((t) => t.id === id).title} · ${tryDone()} of ${TRY_TASKS.length}`); if (typeof renderGuideDock === "function") renderGuideDock(); renderHeader(); }, 30);
}

/* Microsoft Forms long-answer boxes hold about 4,000 characters, so long feedback is split into numbered parts. */
const FORM_LIMIT = 3800;
function feedbackParts() {
  const text = feedbackFormText();
  if (text.length <= FORM_LIMIT) return [text];
  const parts = []; let cur = "";
  text.split("\n").forEach((line) => { if ((cur + line).length + 1 > FORM_LIMIT - 20 && cur) { parts.push(cur); cur = ""; } cur += line + "\n"; });
  if (cur) parts.push(cur);
  return parts.map((p, i) => `(Part ${i + 1} of ${parts.length})\n${p}`);
}
function addQuickComment(text) {

/* ---------- How grades are calculated (plain language) ---------- */
function exampleStudent() {
  const st0 = ui.studentId && studentById(ui.studentId);
  const pool = [st0, ...roster(`all-${ui.semester}`)].filter(Boolean);
  for (const st of pool) {
    const m = metrics(st);
    const c = COMPETENCIES.find((x) => { const a = m.per[x.id].att; return a.length >= 3 && a[0].level < a[a.length - 1].level && countsInGrade(x); });
    if (c && m.policyPct != null) return { st, c, m };
  }
  const st = pool.find((s) => metrics(s).policyPct != null);
  return st ? { st, c: COMPETENCIES.find((x) => metrics(st).per[x.id].att.length), m: metrics(st) } : null;
}

/* ---------- Which fits your school? (open design decisions, each shown with this demo's data) ---------- */
function courseUnder(st, patch) {
  const pc = { ...currentPolicy(), ...patch, anchors: { ...currentPolicy().anchors, ...(patch.anchors || {}) } };
  const vals = COMPETENCIES.filter((c) => countsInGrade(c, pc)).map((c) => { const att = attemptsFor(st.id, c.id); return att.length ? pctFromValue(evaluate(att, pc).value, pc) : null; }).filter((v) => v != null);
  const pct = vals.length ? Math.round(mean(vals)) : null;
  return { pct, letter: letter(pct) };
}
/* Course grade from the evidence dated on or before a day, as PowerSchool would show it if synced then. */
function courseAsOf(st, date) {
  const pc = currentPolicy();
  const vals = COMPETENCIES.filter((c) => countsInGrade(c, pc)).map((c) => { const att = attemptsFor(st.id, c.id).filter((a) => a.date <= date); return att.length ? pctFromValue(evaluate(att, pc).value, pc) : null; }).filter((v) => v != null);
  const pct = vals.length ? Math.round(mean(vals)) : null;
  return { pct, letter: letter(pct) };
}

/* The student whose graded standards change level the most (up and down), for the mastery-graph example. */
function dynamicExample() {
  const dyn = (att) => { const l = att.map((a) => a.level); if (l.length < 3) return -1; let ch = 0; for (let i = 1; i < l.length; i++) if (l[i] !== l[i - 1]) ch++; return ch + (Math.max(...l) - Math.min(...l)) + (l[l.length - 1] > l[0] ? 1 : 0); };
  let best = null;
  for (const st of roster(`all-${ui.semester}`)) {
    const scored = COMPETENCIES.filter((c) => countsInGrade(c)).map((c) => ({ c, d: dyn(attemptsFor(st.id, c.id)) })).filter((x) => x.d > 0).sort((a, b) => b.d - a.d).slice(0, 2);
    if (scored.length < 2) continue;
    const total = scored[0].d + scored[1].d;
    if (!best || total > best.total) best = { st, comps: scored.map((x) => x.c), total };
  }
  return best;
}
/* A student's most recent scored assessments, with a gradebook-style score (export setting) and each standard's entry. */
function recentAssessments(st, n) {
  const ex = state.settings.export;
  return state.assessments.filter((a) => (a.sections || []).includes(st.sectionId) && a.date <= TODAY)
    .map((a) => ({ a, entries: a.comps.map((cid) => ({ c: COMP[cid], e: entryForAssessment(st.id, cid, a.id) })).filter((x) => x.e) }))
    .filter((r) => r.entries.length).sort((p, q) => q.a.date.localeCompare(p.a.date)).slice(0, n)
    .map((r) => {
      const v = Math.round(mean(r.entries.map((x) => exportValue(x.e.level))));
      const score = ex.scoreType === "points" ? `${v}/${ex.total}` : ex.scoreType === "percent" ? `${v}%` : `${fmt1(mean(r.entries.map((x) => x.e.level)))} of 4`;
      return { ...r, score };
    });
}
const lvChip = (l) => `<span class="lv lv-${l}"><span class="n">${l}</span></span>`;
/* A student whose attempts include a slip after a higher score, so "latest" and "highest" differ. */
function slipExample() {
  for (const st of roster(`all-${ui.semester}`)) {
    for (const c of COMPETENCIES) {
      if (!countsInGrade(c)) continue;
      const att = attemptsFor(st.id, c.id), lv = att.map((a) => a.level);
      if (lv.length >= 3 && Math.max(...lv) > lv[lv.length - 1] && lv[0] < Math.max(...lv)) return { st, c, att };
    }
  }
  return null;
}
function miniLevelChart(att) {
  const W = 220, H = 70, pad = 14;
  if (!att.length) return "";
  const d0 = dayNum(att[0].date), d1 = Math.max(d0 + 1, dayNum(att[att.length - 1].date));
  const x = (d) => pad + ((dayNum(d) - d0) / (d1 - d0)) * (W - pad * 2), y = (l) => H - 8 - ((l - 1) / 3) * (H - 18);
  return `<svg viewBox="0 0 ${W} ${H}" class="mini-chart" role="img" aria-label="Levels over time: ${att.map((a) => a.level).join(", ")}">
    <line x1="${pad}" x2="${W - pad}" y1="${y(3)}" y2="${y(3)}" stroke="var(--line)" stroke-dasharray="3 3"/>
    <polyline fill="none" stroke="var(--ink-3)" stroke-width="1.5" points="${att.map((a) => `${x(a.date)},${y(a.level)}`).join(" ")}"/>
    ${att.map((a) => `<circle cx="${x(a.date)}" cy="${y(a.level)}" r="3.5" fill="var(--l${a.level})"/>`).join("")}</svg>`;
}

    const peers = roster(st.sectionId).slice(0, 3);
    const shown = m.active.filter((x) => m.per[x.id].att.length && countsInGrade(x)).slice(0, 3);
    html.gradebook = `<div class="vs">
      <div class="vs-col"><div class="vs-h">Each assessment in PowerSchool</div><p class="tiny muted">One column per assessment${a ? ` (here: ${esc(a.title)}, ${esc(exportTypeLabel())})` : ""}. Familiar to families; PowerSchool averages the columns.</p>
        ${a ? `<table class="mini-table"><thead><tr><th>Student</th>${a.comps.slice(0, 2).map((cid) => `<th>${esc(COMP[cid].standard)}</th>`).join("")}</tr></thead><tbody>${peers.map((p) => `<tr><td>${esc(p.first)}</td>${a.comps.slice(0, 2).map((cid) => { const e = entryForAssessment(p.id, cid, a.id); return `<td class="num">${e ? exportValue(e.level) : "–"}</td>`; }).join("")}</tr>`).join("")}</tbody></table>` : ""}</div>
      <div class="vs-col"><div class="vs-h">Mastery gradebook</div><p class="tiny muted">One score per standard, replaced as the student grows. The course grade comes from current levels.</p>
        <table class="mini-table"><thead><tr><th>Standard</th><th>Level</th><th>%</th></tr></thead><tbody>${shown.map((x) => `<tr><td>${esc(x.standard)}</td><td>${chip(m.per[x.id].ev, true)}</td><td class="num">${Math.round(m.per[x.id].policyPct)}</td></tr>`).join("")}</tbody></table>
        <p class="tiny">${esc(nameOf(st))}, ${esc(sec.name)}: <b>${m.policyLetter} ${m.policyPct}%</b></p></div></div>`;
    /* cadence: what families would see in PowerSchool on each Friday */
    const fridays = []; let dd = TODAY;

  if (!att.length) return { title: `${nameOf(st)} · ${c.standard}`, body: P("No evidence yet on this standard.") + P(c.title) };

  const flag = state.flags[`${sid}|${cid}`]?.on;
  return { title: `${nameOf(st)} · ${c.standard} ${c.title}`,
    body: P(`Current level <b>${fmt1(ev.value)} · ${LEVELS[ev.level].name}</b>${ev.confirmed ? "" : " (needs a second attempt at 3+ to confirm)"}.`) +
      P(`Attempts:<br>${list}`) +
      P(`Under the current rule, ${ruleSentence()}. That converts to <b>${Math.round(policyPct)}%</b>${legacyPct != null ? `; the comparison baseline (${esc(BASELINES[currentPolicy().baseline].name.toLowerCase())}) would give ${Math.round(legacyPct)}%` : ""}.`) +
      (flag ? P("Flagged for a retry.") : "") };

function tipContent(el) {

}

let tipEl = null, tipFor = null;
function showTip(el) {

  tipEl.innerHTML = `<div class="tip-title">${esc(c.title)}</div><div class="tip-body">${c.body}</div>`;
  tipEl.style.display = "block";
  const r = el.getBoundingClientRect(), w = tipEl.offsetWidth, h = tipEl.offsetHeight;
  let left = clamp(r.left + r.width / 2 - w / 2, 8, window.innerWidth - w - 8);
  let top = r.bottom + 8;

}

/* Preview build: no roster import, so added classes get fictional students. */
function fictionalRoster(n, base) {
  const F = ["Avery", "Jordan", "Riley", "Quinn", "Rowan", "Sage", "Emery", "Finley", "Harlow", "Jules", "Kai", "Lane", "Marlow", "Noor", "Oakley", "Parker", "Reese", "Sasha", "Tatum", "Wren", "Zion", "Arden", "Blair", "Cass"];
  const L = ["Ashby", "Brennan", "Calder", "Dunmore", "Ellery", "Fairley", "Garrow", "Holloway", "Ingram", "Jessop", "Kendrick", "Lowell", "Marsh", "Nolan", "Orwell", "Pryce", "Quill", "Radley", "Sutter", "Thorne", "Underhill", "Vance", "Winslow", "Yardley"];
  const rng = mulberry32(base);
  const used = new Set(state.students.map((s) => `${s.first} ${s.last}`));
  const out = [];
  for (let i = 0; out.length < n && i < n * 20; i++) {
    const first = F[Math.floor(rng() * F.length)], last = L[Math.floor(rng() * L.length)];
    if (used.has(`${first} ${last}`)) continue;
    used.add(`${first} ${last}`);
    out.push({ first, last, id: `CT-${base + out.length}` });
  }
  return out;
}

function submitEditAssessment(f) {

function trapFocus(e, container) {

  if (!els.length) return;
  const first = els[0], last = els[els.length - 1];

  else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
}
function onKey(e) {

  }
  if (e.key === "Tab") {

  if (["input", "select", "textarea"].includes(tag) || e.metaKey || e.ctrlKey || e.altKey || transient.dialog) return;

  }
